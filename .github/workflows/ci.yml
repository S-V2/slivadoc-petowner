name: Pet Owner CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: petowner-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web lint, typecheck and build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      # Ratchet against .github/coverage-baseline.json; a PR that raises the
      # number updates the baseline in the same change.
      - run: node scripts/js-coverage.mjs coverage/node.lcov --all app --summary "$GITHUB_STEP_SUMMARY" --baseline .github/coverage-baseline.json --key js_lines
      # The mocked specs check every exchange they fake against
      # slivadoc-backend's api/openapi.yaml at main (tests/e2e/fixtures.ts).
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: S-V2
          repositories: slivadoc-backend
      - uses: actions/checkout@v4
        with:
          repository: S-V2/slivadoc-backend
          token: ${{ steps.app.outputs.token }}
          path: .backend-spec
          sparse-checkout: api/openapi.yaml
          sparse-checkout-cone-mode: false
      - run: npm run test:responsive
        env:
          OPENAPI_SPEC: .backend-spec/api/openapi.yaml

  petowner-api:
    name: Pet Owner API tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/petowner-api
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/petowner-api/package-lock.json
      - run: npm ci
      - run: npm test

  mobile:
    name: Mobile typecheck and tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ui
